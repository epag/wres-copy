# This workflow builds the WRES and executes system tests against various scenarios
name: Code Checks

on:
  push:
  pull_request:

jobs:

  # ========================================================
  # Build and unit test code.
  # ========================================================
  Build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v1
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
    # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@417ae3ccd767c252f5661f1ace9f835f9654f2b5 # v3.1.0

    # Run and build using gradle
    # Disable aggregateJavaDocs
    - name: Run build
      run: |
        ./gradlew distZip testCodeCoverageReport javadoc
        ls -lrt
        ls -lrt build


    - name: testing
      run: |
        ls -lrt
        ls -lrt build/distributions
        ls -lrt ./wres-worker/build/distributions
        ls -lrt ./wres-tasker/build/distributions
        ls -lrt ./wres-writing/build/distributions
        ls -lrt ./wres-vis/build/distributions
        ./scripts/poderize.sh
